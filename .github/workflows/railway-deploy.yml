name: Deploy to Railway

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy bot to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN não configurado — deploy ignorado."
            echo "Configure em GitHub → Settings → Secrets → Actions"
            echo "Ou conecte o repo no painel Railway (Source → GitHub) para auto-deploy."
            echo "Redeploy manual: docs/DEPLOY_RAILWAY.md"
            exit 1
          fi
          if [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "::error::RAILWAY_SERVICE_ID não configurado."
            exit 1
          fi
          railway up --detach --service "${{ secrets.RAILWAY_SERVICE_ID }}"

      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "CONVEX_DEPLOY_KEY não configurado — pulando deploy Convex."
            exit 0
          fi
          npm ci
          npx convex deploy
